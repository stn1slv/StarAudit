name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -v ./...

      - name: Build binaries
        env:
          CGO_ENABLED: 0
        run: |
          GOOS=linux GOARCH=amd64 go build -v -o staraudit-linux-amd64
          GOOS=windows GOARCH=amd64 go build -v -o staraudit-windows-amd64.exe
          GOOS=darwin GOARCH=amd64 go build -v -o staraudit-darwin-amd64
          GOOS=darwin GOARCH=arm64 go build -v -o staraudit-darwin-arm64

      - name: Write checksums
        run: sha256sum staraudit-* > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          staraudit-* checksums.txt
          --verify-tag
          --title "Release $GITHUB_REF_NAME"
          --generate-notes
